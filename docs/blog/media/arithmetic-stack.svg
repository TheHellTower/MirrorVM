<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" role="img" aria-labelledby="title desc">
  <title id="title">Trace of PushInt32 and Div</title>
  <desc id="desc">Three VM steps: push 13, push negative 5, then divide to leave negative 2 on the stack.</desc>
  <rect width="900" height="270" rx="8" fill="#182326"/>
  <g font-family="Consolas, monospace" text-anchor="middle">
    <g transform="translate(35 30)">
      <text x="110" y="18" fill="#a6b6ae" font-size="13">01 - PushInt32(13)</text>
      <rect x="48" y="42" width="124" height="54" rx="3" fill="#243d32" stroke="#688a78"/>
      <text x="110" y="76" fill="#e7efea" font-size="20">13</text>
      <text x="110" y="127" fill="#86c9a4" font-size="12">stack</text>
    </g>
    <path d="M250 100h55m-8-7 8 7-8 7" fill="none" stroke="#f09475" stroke-width="2"/>
    <g transform="translate(315 30)">
      <text x="110" y="18" fill="#a6b6ae" font-size="13">02 - PushInt32(-5)</text>
      <rect x="48" y="42" width="124" height="54" rx="3" fill="#243d32" stroke="#688a78"/>
      <text x="110" y="76" fill="#e7efea" font-size="20">-5</text>
      <rect x="48" y="101" width="124" height="54" rx="3" fill="#1d2a2d" stroke="#688a78"/>
      <text x="110" y="135" fill="#e7efea" font-size="20">13</text>
      <text x="110" y="185" fill="#86c9a4" font-size="12">top to bottom</text>
    </g>
    <path d="M530 100h55m-8-7 8 7-8 7" fill="none" stroke="#f09475" stroke-width="2"/>
    <g transform="translate(595 30)">
      <text x="110" y="18" fill="#a6b6ae" font-size="13">03 - Div</text>
      <rect x="48" y="42" width="124" height="54" rx="3" fill="#243d32" stroke="#86c9a4" stroke-width="2"/>
      <text x="110" y="76" fill="#e7efea" font-size="20">-2</text>
      <text x="110" y="127" fill="#86c9a4" font-size="12">stack</text>
      <text x="110" y="184" fill="#f09475" font-size="13">13 / -5</text>
    </g>
  </g>
  <path d="M45 225H855" stroke="#394942"/>
  <text x="45" y="248" fill="#a6b6ae" font-family="Consolas, monospace" font-size="12">integer division rounds toward zero; operands are left-to-right on the stack</text>
</svg>
